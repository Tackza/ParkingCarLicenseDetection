// Keep expo-dev-client out of RELEASE builds.
//
// Without this a release APK builds fine and then dies the moment React Native builds its
// module registry:
//
//   IllegalStateException: Native module ExpoDevMenuExtensions tried to override
//   DevMenuExtension. Check the getPackages() method in MainApplication.java ...
//
// expo-dev-menu marks itself `debugOnly` for iOS but not for Android, and its DevMenuPackage
// hands back a DevMenuExtension in every variant, so the module ends up registered twice.
// Nothing in a release build wants the dev launcher anyway.
//
// settings.gradle runs before any variant exists, so the build type is inferred from the
// requested task names. Override explicitly with -Pmbus.excludeDevClient=true|false when that
// guess is wrong (e.g. a bare `./gradlew assemble`, which builds both variants at once).
def excludeDevClientOverride = settings.startParameter.projectProperties['mbus.excludeDevClient']
def buildingRelease = settings.startParameter.taskNames.any { it.toLowerCase().contains('release') }
def excludeDevClient = (excludeDevClientOverride ?: buildingRelease.toString()).toBoolean()

if (excludeDevClient) {
  useExpoModules([exclude: ['expo-dev-client', 'expo-dev-launcher', 'expo-dev-menu', 'expo-dev-menu-interface']])
} else {
  useExpoModules()
}

if (getRNMinorVersion() < 75) {
